name: tmp-apply-wh
on:
  push:
    branches: [fix/warehouse-180-365]
    paths: ['.gads-tmp/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          git apply --recount -p1 .gads-tmp/wh.patch
          sha256sum src/lib/adsops/warehouse.server.ts src/lib/adsops/access.server.ts src/components/adsops/analytics-view.tsx src/components/adsops/app-shell.tsx
          rm -rf .gads-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(warehouse): full 180/365-day pull persists account+campaign, 365 button, freshness from last pull"
          git push
