name: phase3-ops
on:
  push:
    branches: [feat/phase3-ui]
    paths: ['.grok/ops/run.sh']
permissions:
  contents: write
  actions: read
concurrency:
  group: phase3-ops
  cancel-in-progress: false
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase3-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run
        run: |
          rm -rf .grok/ops/out .grok/ops/dump && mkdir -p .grok/ops/out
          set +e
          bash .grok/ops/run.sh > .grok/ops/out/log.txt 2>&1
          echo "EXIT=$?" >> .grok/ops/out/log.txt
          set -e
          cp .grok/ops/out/log.txt /tmp/log.txt
          cd .grok/ops/out && split -b 18000 -d -a 2 log.txt log.part. && rm log.txt
      - name: commit
        run: |
          git config user.name 'grok-ops'
          git config user.email 'grok-ops@users.noreply.github.com'
          git add -A -- . ':!node_modules' ':!.vercel' ':!.output' ':!dist'
          git commit -m 'chore(ops): phase3 ops output' || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin feat/phase3-ui && git push origin HEAD:feat/phase3-ui && break; sleep 3; done
