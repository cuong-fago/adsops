name: tmp-apply-deep
on:
  push:
    branches: [fix/deep-layers-chunked]
    paths: ['.gads-tmp/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'PY'
          import zlib, base64, pathlib
          blob = pathlib.Path('.gads-tmp/mod.zlib.b64').read_text().strip()
          pathlib.Path('/tmp/mod.patch').write_bytes(zlib.decompress(base64.b64decode(blob)))
          PY
          git apply --recount -p1 /tmp/mod.patch
          sha256sum src/lib/adsops/analytics.ts src/lib/adsops/warehouse.server.ts src/components/adsops/analytics-view.tsx src/components/adsops/app-shell.tsx src/lib/adsops/connect.functions.ts src/lib/adsops/connect.types.ts
          rm -rf .gads-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(deep): chunked pull UI + partial coverage tables + core-only warehouse"
          git push
