name: rbac-ops
on:
  push:
    branches: [feat/rbac]
  workflow_dispatch:
jobs:
  ops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rbac
      - name: Run staged ops script
        run: |
          set -euo pipefail
          if [ -f .grok/ops/run.sh ]; then
            bash .grok/ops/run.sh
            rm -f .grok/ops/run.sh
          fi
          if [ -f .grok/ops/read.txt ]; then
            mkdir -p .grok/read
            python3 - <<'PY'
          from pathlib import Path
          out = Path('.grok/read')
          for line in Path('.grok/ops/read.txt').read_text().splitlines():
              p = line.strip()
              if not p: continue
              data = Path(p).read_text()
              safe = p.replace('/', '__')
              parts, cur = [], ''
              for ln in data.splitlines(keepends=True):
                  if len((cur + ln).encode()) > 14000 and cur:
                      parts.append(cur); cur = ''
                  cur += ln
              parts.append(cur)
              for i, c in enumerate(parts):
                  (out / f'{safe}.part{i}.txt').write_text(c)
              print('split', p, len(parts))
          PY
            rm -f .grok/ops/read.txt
          fi
      - name: Commit ops result
        run: |
          set -euo pipefail
          git config user.name "cuong-fago"
          git config user.email "cuong@fagogroup.vn"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(rbac): apply staged ops"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund > /tmp/npm.log 2>&1 || (tail -50 /tmp/npm.log; exit 1)
      - name: Typecheck
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 && echo TSC_OK || { echo TSC_FAIL; grep -E 'error TS' /tmp/tsc.log | head -80; }
      - name: Build
        run: |
          node scripts/with-app-env.mjs npx vite build > /tmp/build.log 2>&1 && echo BUILD_OK || { echo BUILD_FAIL; tail -60 /tmp/build.log; exit 1; }
