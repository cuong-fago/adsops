name: tmp-apply-gads
on:
  push:
    branches: [feat/google-ads-api]
    paths: ['.gads-tmp/**']
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-ads-api
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --recount --whitespace=nowarn .gads-tmp/mod.patch || git apply --recount --ignore-whitespace --whitespace=nowarn .gads-tmp/mod.patch
          git rm -rq .gads-tmp
          sha256sum migrations/0006_google_ads.sql src/lib/adsops/google-ads.server.ts src/lib/adsops/warehouse.server.ts src/lib/adsops/report-from-warehouse.ts src/lib/adsops/google-ads.functions.ts src/routes/api/google-ads/oauth/start.ts src/routes/api/google-ads/oauth/callback.ts src/components/adsops/google-ads-admin-card.tsx src/components/adsops/app-shell.tsx src/components/adsops/permissions-panel.tsx src/lib/adsops/access.server.ts src/lib/adsops/access.types.ts src/lib/adsops/analytics.ts src/lib/adsops/connect.server.ts src/lib/adsops/connect.types.ts
          git config user.name "cuong-fago"
          git config user.email "cuong@fagogroup.vn"
          git add -A
          git commit -m "feat(google-ads): wire live pull into report, workspace pack, admin tab"
          git push
